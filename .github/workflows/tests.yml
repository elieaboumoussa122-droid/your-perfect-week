name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Time engine
        run: npm test
      - name: Database schema and row-level security (local Postgres)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-contrib-16 >/dev/null || true
          npm run test:db
